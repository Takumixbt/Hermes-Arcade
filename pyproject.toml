[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-arcade"
version = "3.0.0"
description = "Hermes Arcade: chess, a kart racer and Chrome's dino inside the Hermes terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Takumi" }]
keywords = ["chess", "kart", "terminal", "tui", "sixel", "hermes", "stockfish", "chrome-dino", "arcade"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pillow"]

[project.scripts]
hermes-arcade = "console.cli:main"

[project.urls]
Homepage = "https://github.com/Takumixbt/Hermes-Arcade"

[tool.setuptools.packages.find]
include = ["console", "console.*"]

[tool.setuptools.package-data]
"console.games.dino" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
