# Hermes Arcade: Hermes plugin manifest
# Product name: Hermes Arcade; plugin key / enable slug: hermes-arcade
name: hermes-arcade
version: 3.0.1
description: "Hermes Arcade: chess against the model Hermes is running, a side-view kart racer, and Chrome's dino wearing the Hermes cap. /console opens it, Ctrl+O any time."
author: Takumi
kind: standalone
requires_hermes: ">=0.23.0"
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - subagent_start
  - post_llm_call
  - on_session_end
  - on_session_reset
